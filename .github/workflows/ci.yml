name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet + test)
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Setup Node
        env:
          NVM_DIR: /Users/samuelbailey/.nvm
        run: |
          . "$NVM_DIR/nvm.sh"
          nvm use 20
          echo "$NVM_DIR/versions/node/$(nvm version)/bin" >> $GITHUB_PATH

      - name: Build frontend assets
        working-directory: frontend
        run: npm ci && npm run build

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (build + test)
    runs-on: self-hosted
    env:
      NVM_DIR: /Users/samuelbailey/.nvm
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        run: |
          . "$NVM_DIR/nvm.sh"
          nvm use 20
          echo "$NVM_DIR/versions/node/$(nvm version)/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      - name: Vite build
        run: npm run build

      - name: Vitest
        run: npm test
